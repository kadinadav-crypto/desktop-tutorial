apply plugin: 'com.android.application'

def releaseSigningProperties = [
    storeFile: providers.gradleProperty('videoboxUploadStoreFile').orNull,
    storePassword: providers.gradleProperty('videoboxUploadStorePassword').orNull,
    keyAlias: providers.gradleProperty('videoboxUploadKeyAlias').orNull,
    keyPassword: providers.gradleProperty('videoboxUploadKeyPassword').orNull
]
def releaseSigningConfigured = releaseSigningProperties.values().every { it }
def releaseSigningPartiallyConfigured = releaseSigningProperties.values().any { it }

if (releaseSigningPartiallyConfigured && !releaseSigningConfigured) {
    throw new GradleException('Android release signing requires all videoboxUpload* properties in the user Gradle properties file.')
}

android {
    namespace = "com.kadinadav.videobox"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseSigningProperties.storeFile)
                storePassword releaseSigningProperties.storePassword
                keyAlias releaseSigningProperties.keyAlias
                keyPassword releaseSigningProperties.keyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.kadinadav.videobox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException('Configure the videoboxUpload* properties in the user Gradle properties file before building a release.')
        }
        if (!rootProject.file(releaseSigningProperties.storeFile).isFile()) {
            throw new GradleException('The Android upload keystore configured in the user Gradle properties file was not found.')
        }
    }
}

tasks.configureEach {
    if (name == 'bundleRelease' || name == 'assembleRelease') {
        dependsOn(validateReleaseSigning)
    }
}
